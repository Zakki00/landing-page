<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ovela Ember</title>

  <link rel="stylesheet" href="../css/Ovela Ember.css" />

  <!-- AOS CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

  <div class="content">
    <div class="container1">
      <div class="judul">
        <h1 data-aos="fade-down" data-aos-delay="400">Ovela Ember</h1>

        <p class="tagline" data-aos="fade-down" data-aos-delay="600">
          Hangat seperti bara yang tak padam.
        </p>

        <p class="deskripsi" data-aos="fade-down" data-aos-delay="800">
          Ovela Ember memancarkan kehangatan menggoda dari nuansa amber,
          vanilla panggang, dan rempah halus. Aromanya mengalir pelan seperti
          bara cinta yang tetap menyala, menghadirkan kesan intim yang
          menghangatkan hati.
        </p>

        <div class="harga">
          <span class="label" data-aos="fade-down" data-aos-delay="1000">Harga:</span>
          <span class="nominal" data-aos="fade-down" data-aos-delay="1200">Rp 230.000</span>
        </div>

        <a href="../index.html#kontak" 
           class="btn-beli" 
           data-aos="fade-down" 
           data-aos-delay="1400">Pesan Sekarang</a>
      </div>
    </div>

    <div class="container2">
      <div class="gmb-parfum" data-aos="fade-left" data-aos-delay="600">
        <div class="float-wrapper">
          <img src="../image/Ember1.png" alt="Ovela Parfum" />
        </div>
      </div>

      <div class="altar" data-aos="fade-up" data-aos-delay="900">
        <img src="../image/altar.png" alt="Altar podium" />
      </div>
    </div>
  </div>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      duration: 800,
      easing: "ease-out-cubic"
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Ovela Black Mirage.css">
    <title>Ovela Black Mirage</title>

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
</head>
<body>

<div class="hero-black">

    <div class="content-left"
         data-aos="fade-right" data-aos-duration="1200">
        <h1 class="title-black">
            Ovela <br> Parfum <br> Black Mirage
        </h1>

        <div class="price-box-black"
             data-aos="fade-up" data-aos-duration="1200" data-aos-delay="300">
            <div class="price-black">Rp. 29.000</div>
            <div class="price-info-black">
                Parfum Maskulin <br>
                dengan aroma khas yang tenang dan lembut.
            </div>
        </div>
    </div>

    <img src="../image/Ovela Black Mirage.png" class="parfum-black"
         data-aos="zoom-in" data-aos-duration="1200" data-aos-delay="200">

    <div class="content-right"
         data-aos="fade-left" data-aos-duration="1200" data-aos-delay="400">
        <h2 class="sub-title-black">Ovela Perfume</h2>
        <hr class="divider-black">
        <p class="desc-black">
            “Black is bold, black is elegant“.  
            Made with the best ingredients, this perfume has an elegant and long-lasting fragrance. 
            Feel the goodness of nature with our products.
        </p>
    </div>

</div>

<!-- AOS JS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        once: true,
        offset: 120
    });
</script>

</body>
</html>
